name: Build and push images

# Builds and pushes a container image to ghcr.io for whichever
# service(s) changed on a push to main. Each service has its own
# VERSION file (e.g. backend/VERSION) that this workflow bumps
# (patch version) and commits back, then tags/pushes the image with
# that version plus `latest`. This workflow does not deploy anything -
# rolling out the new image to the cluster stays a manual step.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "room-service/**"
      - ".github/workflows/build-images.yml"

# Only one run at a time, since each job commits a VERSION bump back
# to main and overlapping runs would race on that commit.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      room: ${{ steps.filter.outputs.room }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            room:
              - 'room-service/**'

  build-api:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump patch version
        id: version
        run: |
          current=$(cat backend/VERSION)
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "$next" > backend/VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push astradraw-api
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/klem-s/astradraw-api:${{ steps.version.outputs.version }}
            ghcr.io/klem-s/astradraw-api:latest

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/VERSION
          git commit -m "ci: bump astradraw-api to ${{ steps.version.outputs.version }} [skip ci]"
          git push

  build-app:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump patch version
        id: version
        run: |
          current=$(cat frontend/VERSION)
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "$next" > frontend/VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push astradraw-app
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/klem-s/astradraw-app:${{ steps.version.outputs.version }}
            ghcr.io/klem-s/astradraw-app:latest

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/VERSION
          git commit -m "ci: bump astradraw-app to ${{ steps.version.outputs.version }} [skip ci]"
          git push

  build-room:
    needs: changes
    if: needs.changes.outputs.room == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump patch version
        id: version
        run: |
          current=$(cat room-service/VERSION)
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "$next" > room-service/VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push astradraw-room
        uses: docker/build-push-action@v5
        with:
          context: room-service
          file: room-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/klem-s/astradraw-room:${{ steps.version.outputs.version }}
            ghcr.io/klem-s/astradraw-room:latest

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add room-service/VERSION
          git commit -m "ci: bump astradraw-room to ${{ steps.version.outputs.version }} [skip ci]"
          git push
